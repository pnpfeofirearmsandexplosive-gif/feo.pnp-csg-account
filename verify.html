<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>License To Own And Possess Firearms Verification</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:linear-gradient(180deg,#475487 0%,#46548e 42%,#5868bd 100%);
  min-height:100vh;
  padding:18px 0 38px;
  color:#35406d;
}
.verify-page{width:410px;max-width:92%;margin:0 auto;}
.verify-title-bar{
  display:flex;align-items:flex-start;gap:10px;color:#fff;font-weight:800;
  font-size:24px;line-height:1.22;margin:10px 0 18px;
}
.verify-check{
  width:28px;height:28px;border-radius:50%;border:3px solid #fff;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;
  flex:0 0 28px;margin-top:2px;
}
.wrapper{
  width:100%;background:#fff;border-radius:5px;overflow:hidden;
  box-shadow:0 17px 28px rgba(17,24,72,.28);
}
.top{background:#eef1f8;padding:38px 33px 34px;position:relative;}
.control-box{
  width:235px;max-width:100%;margin:0 0 28px 20px;background:#e7eaf4;border-radius:999px;
  padding:12px 16px;text-align:center;color:#3f4979;font-size:17px;font-weight:800;
}
.address{display:grid;grid-template-columns:32px 1fr 26px;align-items:start;gap:10px;color:#3f4979;font-size:15px;line-height:1.3;font-weight:800;text-transform:uppercase;}
.custom-pin svg{width:25px;height:25px;display:block;margin-top:0}
.help-icon{
  width:17px;height:17px;border:2px solid #d7e1eb;background:#78afd1;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;
  box-shadow:0 1px 2px rgba(0,0,0,.16);justify-self:end;margin-top:31px;
}
.content{padding:24px 14px 20px;background:white;}
.section{
  border:1px solid #e7eaf0;border-radius:4px;background:#fff;overflow:hidden;margin-bottom:22px;
  box-shadow:0 1px 4px rgba(37,52,101,.05);
}
.section-head{
  padding:15px 18px 14px;font-size:19px;font-weight:800;line-height:1.18;color:#36416f;
  border-bottom:1px solid #e7eaf0;
}
.section-body{padding:17px 19px 18px;}
.info-row{display:grid;grid-template-columns:48px 1fr;gap:18px;align-items:center;margin:0 0 19px;}
.info-row:last-child{margin-bottom:0}
.circle{
  width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.green{background:#94e7bd}.blue{background:#a9d8ff}.red{background:#ffadaf}.purple{background:#aaa4ff}.yellow{background:#f6dd70}
.circle svg{display:block}
.info-text h3{font-size:15px;color:#37416f;font-weight:800;margin:0 0 4px;line-height:1.15}
.info-text p{font-size:16px;color:#37416f;font-weight:500;line-height:1.18}
.info-text p.strong{font-weight:800}
.footer{
  margin-top:20px;background:#f7f8fb;border-radius:4px;text-align:center;color:#4a527e;
  padding:23px 20px;font-size:15px;line-height:1.25;box-shadow:0 10px 26px rgba(255,255,255,.28);
}
@media(max-width:430px){
  body{padding:14px 0 34px}.verify-page{width:calc(100% - 28px);max-width:410px}
  .verify-title-bar{font-size:23px;margin:7px 0 16px}.wrapper{border-radius:5px}
  .top{padding:34px 28px 30px}.control-box{margin-left:16px;width:220px;font-size:16px;padding:11px 14px}.content{padding:22px 13px 18px}
  .section-head{font-size:18px}.info-row{gap:17px}.footer{font-size:14px;padding:22px 14px}
}
</style>
</head>
<body>
<div class="verify-page">
  <div class="verify-title-bar">
    <div class="verify-check">✓</div>
    <div>Verified License to Own and Possess Firearm</div>
  </div>

  <div class="wrapper">
    <div class="top">
      <div class="control-box" id="controlNo">LOADING...</div>
      <div class="address">
        <div class="custom-pin">
          <svg viewBox="0 0 24 24"><path fill="#465082" d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7zm0 9.4A2.4 2.4 0 1 1 12 6.6a2.4 2.4 0 0 1 0 4.8z"/></svg>
        </div>
        <div id="addressText">LOADING...</div>
        <div class="help-icon">?</div>
      </div>
    </div>

    <div class="content">
      <div class="section">
        <div class="section-head">License To Own And Possess Firearms Validity</div>
        <div class="section-body">
          <div class="info-row">
            <div class="circle green">
              <svg viewBox="0 0 32 32" width="25" height="25">
                <rect x="6" y="10" width="20" height="13" rx="2" fill="#49c98c"/>
                <rect x="9" y="13" width="6" height="4" rx="1" fill="#bff2d8"/>
                <rect x="17" y="13" width="6" height="2.2" rx="1" fill="#bff2d8"/>
                <rect x="17" y="17" width="5" height="2" rx="1" fill="#bff2d8"/>
              </svg>
            </div>
            <div class="info-text"><h3>Date Issued:</h3><p id="issuedDate">-</p></div>
          </div>

          <div class="info-row">
            <div class="circle blue">
              <svg viewBox="0 0 32 32" width="25" height="25">
                <g transform="rotate(-35 16 16)">
                  <rect x="13" y="5" width="5" height="13" rx="1.2" fill="#4a91de"/>
                  <rect x="8" y="5" width="15" height="4" rx="1.2" fill="#4a91de"/>
                  <rect x="10" y="19" width="13" height="4" rx="1.2" fill="#4a91de"/>
                  <rect x="14" y="22" width="9" height="3" rx="1" fill="#4a91de"/>
                </g>
              </svg>
            </div>
            <div class="info-text"><h3>Date Approved:</h3><p id="approvedDate">-</p></div>
          </div>

          <div class="info-row">
            <div class="circle red">
              <svg viewBox="0 0 32 32" width="24" height="24">
                <circle cx="16" cy="16" r="12" fill="#eb5c5d"/>
                <rect x="14.4" y="8" width="3.2" height="11" rx="1.6" fill="#ffbdbd"/>
                <circle cx="16" cy="23" r="1.8" fill="#ffbdbd"/>
              </svg>
            </div>
            <div class="info-text"><h3>Date Expiry:</h3><p id="expiryDate">-</p></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">License Details</div>
        <div class="section-body">
          <div class="info-row">
            <div class="circle purple">
              <svg viewBox="0 0 32 32" width="24" height="24">
                <path fill="#625fd2" d="M10.4 7.5c-.9.2-2.2 1-2.5 2.2-.5 2 1.2 6.1 4.8 9.7 3.7 3.7 7.7 5.3 9.7 4.8 1.2-.3 2-1.6 2.2-2.5.1-.5-.1-.9-.5-1.1l-4.2-2.2c-.4-.2-.9-.1-1.2.2l-1.5 1.5c-2.1-1.1-4.1-3.1-5.2-5.2l1.5-1.5c.3-.3.4-.8.2-1.2l-2.2-4.2c-.2-.4-.6-.6-1.1-.5z"/>
              </svg>
            </div>
            <div class="info-text"><h3>Qualification</h3><p class="strong" id="qualificationText">-</p></div>
          </div>

          <div class="info-row">
            <div class="circle yellow">
              <svg viewBox="0 0 32 32" width="24" height="24">
                <path fill="#d2ad19" d="M12 6h3l-1 7h5l1-7h3l-1 7h4v3h-4.5l-.7 5H24v3h-4.6l-.8 5h-3l.8-5h-5l-.8 5h-3l.8-5H4v-3h4.8l.7-5H6v-3h3.9L11 6zm1.6 10-.7 5h5l.7-5h-5z"/>
              </svg>
            </div>
            <div class="info-text"><h3>Other Licenses</h3><p class="strong" id="otherLicenseText">N/A</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">Philippine National Police © 2023. All Rights Reserved.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD592e9TKVm8WnujW0foJ8LhsMAzF3OtzI",authDomain:"feo-portal.firebaseapp.com",projectId:"feo-portal",storageBucket:"feo-portal.firebasestorage.app",messagingSenderId:"231610467505",appId:"1:231610467505:web:f2f2304bf275d2aaab0e90"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const params=new URLSearchParams(location.search);
const uid=params.get("uid");
function formatDate(v){
  if(!v)return "-";
  const s=String(v).trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return s;
  const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  return d.toLocaleDateString("en-US",{month:"long",day:"2-digit",year:"numeric"});
}
async function loadVerification(){
  if(!uid){document.body.innerHTML="<h1 style='color:white;text-align:center;margin-top:100px;'>INVALID QR CODE</h1>";return;}
  const doc=await db.collection("users").doc(uid).get();
  if(!doc.exists){document.body.innerHTML="<h1 style='color:white;text-align:center;margin-top:100px;'>NO RECORD FOUND</h1>";return;}
  const d=doc.data();
  if(d.idStatus!=="RELEASED"){document.body.innerHTML="<h1 style='color:white;text-align:center;margin-top:100px;'>LICENSE NOT RELEASED</h1>";return;}
  document.getElementById("controlNo").innerText=d.control||"-";
  document.getElementById("addressText").innerText=d.address||"-";
  document.getElementById("issuedDate").innerText=formatDate(d.examTaken||d.dateIssued||d.issuedDate);
  document.getElementById("approvedDate").innerText=formatDate(d.interviewTaken||d.dateApproved||d.approvedDate);
  document.getElementById("expiryDate").innerText=formatDate(d.expiry||d.dateExpiry||d.expiryDate);
  document.getElementById("qualificationText").innerText=d.role||d.qualification||"-";
  document.getElementById("otherLicenseText").innerText=d.otherLicense||d.otherLicenses||"N/A";
}
loadVerification();
</script>
</body>
</html>
